  direction: ROS_TO_GZ
- ros_topic_name: /robot_00/arm/panda_joint5/position
  gz_topic_name: /model/panda_00/joint/panda_joint5/0/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
