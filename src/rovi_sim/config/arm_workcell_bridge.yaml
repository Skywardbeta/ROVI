# ros_gz bridge for the arm workcell: simulation clock and joint states out; per-joint position commands in.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
- ros_topic_name: /robot_00/joint_states
  gz_topic_name: /world/arm_workcell/model/panda_00/joint_state
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS
- ros_topic_name: /robot_00/arm/panda_joint1/position
  gz_topic_name: /model/panda_00/joint/panda_joint1/0/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /robot_00/arm/panda_joint2/position
  gz_topic_name: /model/panda_00/joint/panda_joint2/0/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /robot_00/arm/panda_joint3/position
  gz_topic_name: /model/panda_00/joint/panda_joint3/0/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
