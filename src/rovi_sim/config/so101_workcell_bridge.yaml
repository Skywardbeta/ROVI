# ros_gz bridge for the SO-101 workcell: simulation clock and joint states out; per-joint position commands in.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
- ros_topic_name: /robot_00/joint_states
  gz_topic_name: /world/so101_workcell/model/so101_00/joint_state
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS
- ros_topic_name: /robot_00/arm/shoulder_pan/position
  gz_topic_name: /model/so101_00/joint/shoulder_pan/0/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /robot_00/arm/shoulder_lift/position
  gz_topic_name: /model/so101_00/joint/shoulder_lift/0/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /robot_00/arm/elbow_flex/position
  gz_topic_name: /model/so101_00/joint/elbow_flex/0/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /robot_00/arm/wrist_flex/position
  gz_topic_name: /model/so101_00/joint/wrist_flex/0/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /robot_00/arm/wrist_roll/position
  gz_topic_name: /model/so101_00/joint/wrist_roll/0/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /robot_00/arm/gripper/position
  gz_topic_name: /model/so101_00/joint/gripper/0/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
