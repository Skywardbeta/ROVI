name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake libgtest-dev python3-colcon-common-extensions python3-pip
          python3 -m pip install --break-system-packages clang-format==23.1.3

      - name: Check formatting
        run: find src \( -name '*.hpp' -o -name '*.cpp' \) -print0 | xargs -0 clang-format --dry-run --Werror

      - name: Check generated thirty-arm files
        run: bash scripts/generate_thirty_arms.sh --check

      - name: Build and test rovi_core
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select rovi_core --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo
          colcon test --packages-select rovi_core --return-code-on-test-failure
          colcon test-result --verbose
